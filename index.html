<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuneScreens — Watch it right.</title>
<meta name="description" content="The best movies, theaters and seats in Pune. Tap any seat to see the view.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0d0f14;--card:#161a22;--card2:#1e2430;--line:#252c3a;--ink:#f0f2f7;--mut:#8a93a6;--acc:#f5b942;
--s5:#22c07a;--s4:#8fce5f;--s3:#e3c14f;--s2:#e0854a;--s1:#d84f4f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'Space Grotesk',system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 90px}
/* top bar */
#bar{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px}
.logo{font-weight:700;font-size:1.15rem;cursor:pointer}
.logo span{color:var(--acc)}
.city{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.city b{color:var(--acc)}
#userbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:99px;width:38px;height:38px;font-size:1rem;cursor:pointer;color:var(--ink)}
/* generic */
h1{font-size:1.9rem;line-height:1.15;margin:26px 0 6px}
.sub{color:var(--mut);font-size:.95rem;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:.88rem;cursor:pointer;margin:18px 0 4px;border:0;background:none}
.back:hover{color:var(--acc)}
/* home */
.bigbtn{display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-bottom:14px;cursor:pointer;color:var(--ink);transition:.2s}
.bigbtn:active{transform:scale(.98)}
.bigbtn:hover{border-color:var(--acc)}
.bigbtn .e{font-size:1.9rem;display:block;margin-bottom:8px}
.bigbtn .t{font-size:1.25rem;font-weight:700}
.bigbtn .d{color:var(--mut);font-size:.88rem;margin-top:3px}
/* cards / lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.card:hover{border-color:#3a4356}.card:active{transform:scale(.985)}
.row1{display:flex;align-items:center;gap:12px}
.poster{width:52px;height:52px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.ct{flex:1;min-width:0}
.ct .t{font-weight:700;font-size:1.02rem}
.ct .d{color:var(--mut);font-size:.82rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-weight:700;font-size:1.05rem;min-width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.b5{background:rgba(34,192,122,.14);color:var(--s5)}.b4{background:rgba(143,206,95,.14);color:var(--s4)}
.b3{background:rgba(227,193,79,.12);color:var(--s3)}.b2{background:rgba(224,133,74,.12);color:var(--s2)}.b1{background:rgba(216,79,79,.12);color:var(--s1)}
.chev{color:#4a5468;flex:none}
.whybox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--mut);font-size:.84rem}
.whybox b{color:var(--s5)}
.rankn{color:var(--mut);font-weight:700;width:24px;flex:none;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--card2);border-radius:7px;padding:3px 9px;font-size:.72rem;color:#b8c0d2}
.chip.gold{color:var(--acc);background:rgba(245,185,66,.1)}
/* seat map */
.mapcard{background:#10131a;border:1px solid var(--line);border-radius:18px;padding:20px 10px 14px;margin:14px 0}
.screenbar{height:6px;border-radius:3px;background:linear-gradient(90deg,#3b4a7a,#aebef5,#3b4a7a);margin:0 auto 4px;box-shadow:0 6px 24px rgba(160,175,255,.35)}
.screenlbl{text-align:center;color:#5a647a;font-size:.68rem;letter-spacing:.25em;margin-bottom:14px}
.srow{display:flex;justify-content:center;gap:3px;margin-bottom:3.5px;align-items:center}
.srl{width:14px;font-size:9px;color:#4a5468;text-align:right;margin-right:3px;flex:none}
.seat{border-radius:3px;cursor:pointer;flex:none;transition:transform .1s}
.seat:hover{transform:scale(1.35);z-index:2}
.gap{flex:none}
.maplegend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:.72rem;color:var(--mut)}
.lg{display:flex;align-items:center;gap:5px}.sw{width:10px;height:10px;border-radius:3px}
.hint{text-align:center;color:var(--acc);font-size:.82rem;margin-top:10px}
.seatlists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.slbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.slbox h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.slbox.best h3{color:var(--s5)}.slbox.worst h3{color:var(--s1)}
.slbox .seats{display:flex;flex-wrap:wrap;gap:6px}
.pillseat{border-radius:7px;padding:3px 9px;font-size:.8rem;font-weight:700;cursor:pointer}
.pillseat.g{background:rgba(34,192,122,.15);color:var(--s5)}.pillseat.r{background:rgba(216,79,79,.13);color:var(--s1)}
/* 3D viewer */
#viewer{position:fixed;inset:0;background:#05060a;z-index:60;display:none;flex-direction:column}
#viewer.open{display:flex}
#vtop{display:flex;align-items:center;gap:12px;padding:14px 18px;z-index:2}
#vtop .t{font-weight:700}
#vtop .d{color:var(--mut);font-size:.8rem}
#vclose{margin-left:auto;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:99px;width:40px;height:40px;font-size:1.05rem;cursor:pointer}
#vc{flex:1;touch-action:none;cursor:grab}
#vbot{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
.vscore{font-weight:700;padding:6px 14px;border-radius:99px;font-size:.9rem}
#vbot .m{color:var(--mut);font-size:.78rem}
.vbtn{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:99px;padding:8px 16px;font-size:.82rem;cursor:pointer}
.vbtn.on{background:var(--acc);color:#111}
/* login modal */
#login{position:fixed;inset:0;background:rgba(5,6,10,.8);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#login.open{display:flex}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:340px;width:100%}
.lbox h2{margin-bottom:6px}.lbox p{color:var(--mut);font-size:.88rem;margin-bottom:16px}
.lbox input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:1rem;margin-bottom:12px}
.lbox button{width:100%;background:var(--acc);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:1rem;cursor:pointer}
.soon{opacity:.45;pointer-events:none}
footer{max-width:640px;margin:30px auto 0;padding:20px 18px;color:#4a5468;font-size:.75rem;text-align:center}
@media(max-width:420px){.seatlists{grid-template-columns:1fr}}
</style></head><body>

<div id="bar"><div class="in">
 <div class="logo" onclick="go('home')">Pune<span>Screens</span></div>
 <button class="city" onclick="cityMenu()">📍 <b>Pune</b> ▾</button>
 <button id="userbtn" onclick="openLogin()">👤</button>
</div></div>

<div class="wrap" id="app"></div>
<footer>PuneScreens · Pune today — Mumbai &amp; Chennai next</footer>

<div id="viewer">
 <div id="vtop"><div><div class="t" id="vt"></div><div class="d" id="vd"></div></div><button id="vclose" onclick="closeViewer()">✕</button></div>
 <canvas id="vc"></canvas>
 <div id="vbot">
  <span class="vscore" id="vscore"></span>
  <button class="vbtn on" id="bSeat" onclick="setMode('seat')">👁 From this seat</button>
  <button class="vbtn" id="bHall" onclick="setMode('hall')">🏛 Whole hall</button>
  <span class="m">drag to look around · scroll to zoom</span>
 </div>
</div>

<div id="login"><div class="lbox">
 <h2>Hey there 👋</h2><p>Tell us your name — we'll remember your seats.</p>
 <input id="lname" placeholder="Your name" maxlength="30">
 <button onclick="doLogin()">Let's go</button>
</div></div>

   const rr=d/(1.2*W);
   const pd=Math.min(1,Math.abs(Math.log(rr))/0.75);
   const pl=Math.min(1,Math.atan(Math.abs(x)/d)/0.5);
   const pv=d<0.55*W?Math.min(1,(0.55*W-d)/(0.35*W)):0;
   let sc=Math.round(100*(1-0.42*pd-0.36*pl-0.22*pv));
   sc=Math.max(8,Math.min(99,sc));
   rowSeats.push({row:r[0],n:idx,x,d,ri,sc,cls:g[1]});}});
  graded.push(rowSeats);});
 return graded;}

/* ---------- 3D: hall + first-person from seat ---------- */
let R3=null,scene,camera,raf=null,mode='seat',seatPos=null,yaw=0,pitchA=0,theta=.55,phi=1.1,radius=90,target3;
const vc=document.getElementById('vc'),viewer=document.getElementById('viewer');
function seatDims(c){if(c==='sf')return[3.1,2.4];if(c==='rc'||c==='ry')return[2.3,2.2];if(c==='el'||c==='xl')return[1.9,1.9];return[1.6,1.5];}
function openSeat(ri,n){
 const h=curHall,st=curGrade[ri].find(s=>s.n===n);if(!st)return;
 document.getElementById('vt').textContent=h.v+' — '+h.s;
 document.getElementById('vd').textContent='Seat '+st.row+st.n;
 const t=tier(st.sc);
 const vs=document.getElementById('vscore');vs.textContent=st.sc+'/100 · '+TNAME[t];
 vs.style.background=`color-mix(in srgb,${TCOL[t]} 18%,transparent)`;vs.style.color=TCOL[t];
 viewer.classList.add('open');
 if(!R3){R3=new THREE.WebGLRenderer({canvas:vc,antialias:true});R3.setPixelRatio(Math.min(devicePixelRatio,2));}
 buildScene(h,st);setMode('seat');animate();}
function setMode(m){mode=m;
 document.getElementById('bSeat').classList.toggle('on',m==='seat');
 document.getElementById('bHall').classList.toggle('on',m==='hall');
 if(m==='seat'){yaw=0;pitchA=0;}else{theta=.55;phi=1.1;}}
function closeViewer(){viewer.classList.remove('open');if(raf)cancelAnimationFrame(raf);raf=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();});
function buildScene(o,st){
 if(raf)cancelAnimationFrame(raf);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x05060a);scene.fog=new THREE.Fog(0x05060a,160,420);
 const W=o.w,H=o.h,firstD=0.42*W,scrBase=3.2,rowRise=1.05;
 const pitchOf=c=>(c==='rc'||c==='ry'||c==='sf')?4.6:3.7;
 let depth=firstD;o.lay.forEach(r=>depth+=pitchOf(r[1][0][1]));
 const maxRow=Math.max(...o.lay.map(r=>r[1].reduce((a,g)=>a+g[0],0)));
 const hallW=Math.max(W+10,maxRow*1.9+12);
 target3=new THREE.Vector3(0,H*0.35,depth*0.45);radius=Math.max(depth*1.15,W*1.4);
 camera=new THREE.PerspectiveCamera(70,1,0.1,1500);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(hallW,depth+24),new THREE.MeshStandardMaterial({color:0x12141c,roughness:.95}));
 floor.rotation.x=-Math.PI/2;floor.position.z=depth/2;scene.add(floor);
 const ceil=new THREE.Mesh(new THREE.PlaneGeometry(hallW,depth+24),new THREE.MeshStandardMaterial({color:0x0a0b11,roughness:1}));
 ceil.rotation.x=Math.PI/2;ceil.position.set(0,H+16,depth/2);scene.add(ceil);
 const wallM=new THREE.MeshStandardMaterial({color:0x0e1016,roughness:1});
 [-1,1].forEach(sg=>{const wl=new THREE.Mesh(new THREE.PlaneGeometry(depth+24,H+24),wallM);
  wl.rotation.y=sg<0?Math.PI/2:-Math.PI/2;wl.position.set(sg*hallW/2,(H+24)/2,depth/2);scene.add(wl);});
 const back=new THREE.Mesh(new THREE.PlaneGeometry(hallW,H+24),wallM);back.position.set(0,(H+24)/2,depth+12);back.rotation.y=Math.PI;scene.add(back);
 // screen with a fake "movie" gradient via canvas texture
 const cnv=document.createElement('canvas');cnv.width=512;cnv.height=Math.round(512*H/W);
 const g=cnv.getContext('2d');const gr=g.createLinearGradient(0,0,512,cnv.height);
 gr.addColorStop(0,'#2b3f74');gr.addColorStop(.45,'#c8d4ff');gr.addColorStop(.55,'#e8b96a');gr.addColorStop(1,'#1c2440');
 g.fillStyle=gr;g.fillRect(0,0,512,cnv.height);
 const tex=new THREE.CanvasTexture(cnv);
 const scr=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({map:tex}));
 scr.position.set(0,scrBase+H/2,0);scene.add(scr);
 const sl=new THREE.PointLight(0x9aa4e8,1.2,260);sl.position.set(0,scrBase+H/2,18);scene.add(sl);
 scene.add(new THREE.AmbientLight(0x9090b0,.4));
 const frameM=new THREE.MeshBasicMaterial({color:0x030308});
 const fb=new THREE.Mesh(new THREE.BoxGeometry(W+4,2,1),frameM);fb.position.set(0,scrBase-1,0);scene.add(fb);
 const ft=fb.clone();ft.position.y=scrBase+H+1;scene.add(ft);
 // seats
 const mkSeat=(x,y,z,cw,cd,m)=>{const s1=new THREE.Mesh(new THREE.BoxGeometry(cw*0.86,1.6,cd*0.8),m);s1.position.set(x,y+0.8,z);scene.add(s1);
  const bk=new THREE.Mesh(new THREE.BoxGeometry(cw*0.86,1.5,0.32),m);bk.position.set(x,y+2.2,z+cd*0.45);scene.add(bk);};
 let z=firstD,y=0;seatPos=null;
 o.lay.forEach((r,ri)=>{
  const cls0=r[1][0][1],pitch=pitchOf(cls0);
  const aisle=3,fullW=r[1].reduce((a,g)=>a+g[0]*seatDims(g[1])[0],0)+(r[1].length-1)*aisle;
  const ris=new THREE.Mesh(new THREE.BoxGeometry(Math.min(hallW-2,fullW+3),Math.max(0.2,y),pitch),new THREE.MeshStandardMaterial({color:0x161822,roughness:1}));
  ris.position.set(0,Math.max(0.1,y/2),z);scene.add(ris);
  let x=-fullW/2,idx=0;
  r[1].forEach(gp=>{const [gw,gd]=seatDims(gp[1]);
   for(let k=0;k<gp[0];k++){idx++;const cx=x+gw/2;
    const isSel=(ri===st.ri&&idx===st.n);
    const m=new THREE.MeshStandardMaterial({color:isSel?0xf5b942:CCOL[gp[1]]||0x5a2c33,roughness:.75,emissive:isSel?0x664411:0x000000});
    mkSeat(cx,y,z,gw,gd,m);
    if(isSel){seatPos=new THREE.Vector3(cx,y+3.8,z);
     const gl=new THREE.PointLight(0xf5b942,1,12);gl.position.set(cx,y+5,z);scene.add(gl);}
    x+=gw;}
   x+=aisle;});
  z+=pitch;y+=rowRise*((cls0==='rc'||cls0==='ry'||cls0==='sf')?1.25:1);});
 if(!seatPos)seatPos=new THREE.Vector3(0,4,depth*0.6);
 window._scrCenter=new THREE.Vector3(0,scrBase+H/2,0);
}
function animate(){raf=requestAnimationFrame(animate);
 const w=vc.clientWidth,hh=vc.clientHeight;
 if(vc.width!==w*R3.getPixelRatio()||vc.height!==hh*R3.getPixelRatio()){R3.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
 if(mode==='seat'){
  camera.position.copy(seatPos);
  const base=new THREE.Vector3().subVectors(window._scrCenter,seatPos).normalize();
  const baseYaw=Math.atan2(base.x,-base.z),basePitch=Math.asin(base.y);
  const cy=baseYaw+yaw,cp=Math.max(-1.3,Math.min(1.3,basePitch+pitchA));
  camera.lookAt(seatPos.x+Math.sin(cy)*Math.cos(cp),seatPos.y+Math.sin(cp),seatPos.z-Math.cos(cy)*Math.cos(cp));
  camera.fov=70;
 }else{
  camera.position.set(target3.x+radius*Math.sin(phi)*Math.sin(theta),target3.y+radius*Math.cos(phi),target3.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target3);camera.fov=50;}
 camera.updateProjectionMatrix();
 R3.render(scene,camera);}
let drag=false,px=0,py=0;
vc.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;vc.setPointerCapture(e.pointerId);vc.style.cursor='grabbing'});
vc.addEventListener('pointermove',e=>{if(!drag)return;
 if(mode==='seat'){yaw+=(e.clientX-px)*0.004;pitchA+=(e.clientY-py)*0.003;}
 else{theta-=(e.clientX-px)*0.005;phi=Math.min(1.5,Math.max(0.25,phi-(e.clientY-py)*0.004));}
 px=e.clientX;py=e.clientY;});
vc.addEventListener('pointerup',()=>{drag=false;vc.style.cursor='grab'});
vc.addEventListener('wheel',e=>{e.preventDefault();
 if(mode==='hall')radius=Math.min(550,Math.max(25,radius+e.deltaY*0.12));},{passive:false});
